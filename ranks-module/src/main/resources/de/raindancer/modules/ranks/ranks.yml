# The ranks on this server. Written out once — edit freely, then /rank reload.
#
#   tag:    what goes in front of the name, in MiniMessage: colours and <bold> are fine, clicks are not.
#           Keep it short — above a head everything past 32 characters is cut off.
#   team:   true puts whoever holds it in the server's team — listed on its own at the top of the tablist.
#   weight: 1–99, higher is more senior. Somebody holding several wears the highest unless they pick
#           another, and the tablist puts higher ranks nearer the top.
#   welcome: lines told once to whoever gets the rank (in game, or on their next join) — what it gives them.
#   styles: other tags a holder may pick instead (/rank style), by id — the same rules as tag. Each is a badge too.
#   groups: the LuckPerms groups that give the rank, e.g. groups: [moderator, trialmod]. Left out, it is
#           the group named like the rank. Inherited groups count: an admin group inheriting mod holds both.
#
# Ranks and LuckPerms are one thing: being in a rank's group holds the rank, and /rank give and /rank take
# put somebody in or take them out of the rank's group when that group exists in LuckPerms. A rank without
# a group (or a server without LuckPerms) is kept in holders.yml instead. The staff ranks (support, mod,
# admin, owner, builder, creator, dev, tester) have their groups made by /promote.
ranks:
  owner:
    team: true
    title: "Owner"
    tag: "<dark_red><bold>[OWNER]</bold></dark_red>"
    weight: 99
    description:
      - "The person whose server it is."
  admin:
    team: true
    title: "Admin"
    tag: "<red><bold>[ADMIN]</bold></red>"
    weight: 90
    description:
      - "Runs the server day to day."
  dev:
    team: true
    title: "Developer"
    tag: "<aqua><bold>[DEV]</bold></aqua>"
    weight: 80
    description:
      - "Builds the plugins this server runs on."
  team:
    team: true
    title: "Team"
    tag: "<light_purple><bold>[TEAM]</bold></light_purple>"
    weight: 75
    description:
      - "Part of the server's team."
  mod:
    team: true
    title: "Moderator"
    tag: "<gold><bold>[MOD]</bold></gold>"
    weight: 70
    description:
      - "Keeps the peace."
  support:
    team: true
    title: "Support"
    tag: "<green>[SUPPORT]</green>"
    weight: 62
    description:
      - "Answers questions and helps new players."
  helper:
    team: true
    title: "Helper"
    tag: "<green>[HELPER]</green>"
    weight: 60
    description:
      - "Answers questions and helps new players."
  builder:
    team: true
    title: "Builder"
    tag: "<yellow>[BUILDER]</yellow>"
    weight: 50
    description:
      - "Builds the spawn, the hub and everything in between."
  creator:
    team: true
    title: "Creator"
    tag: "<light_purple>[CREATOR]</light_purple>"
    weight: 45
    description:
      - "Makes videos and streams about the server."
    welcome:
      - "Found a guild for free with <white>/guild</white>: no price, no hours played first."
      - "Every cosmetic is yours, free: name styles, particles, teleport looks and weapon skins in <white>/cosmetics</white>."
  tester:
    team: true
    title: "Tester"
    tag: "<gray>[TESTER]</gray>"
    weight: 40
    description:
      - "Tries new features before everybody else does."
  prime:
    title: "Prime"
    tag: "<gradient:#ff3d9a:#ff9ad5><bold>[PRIME]</bold></gradient>"
    weight: 38
    description:
      - "Supports the server with the Prime subscription."
    welcome:
      - "Thank you for Prime! Your name can now be painted in <white>/cosmetics</white>, with particles, teleport looks, the weapon and armour skins (all but a few creator-only ones), and each month's Prime drop."
      - "Pick the colours of your <white>[PRIME]</white> badge with <white>/rank style</white>."
      - "Want an image as map art? <white>/prime mapart</white>. Your feature ideas jump the queue."
    styles:
      hot-pink: "<gradient:#ff3d9a:#ff9ad5><bold>[PRIME]</bold></gradient>"
      rose-gold: "<gradient:#ff8fb1:#ffd27a><bold>[PRIME]</bold></gradient>"
      pink-gold-pink: "<gradient:#ff5fa2:#ffc94a:#ff5fa2><bold>[PRIME]</bold></gradient>"
      gold-hot-pink: "<gradient:#ffd700:#ff69b4><bold>[PRIME]</bold></gradient>"
      pure-gold: "<gradient:#ffe08a:#e6a817><bold>[PRIME]</bold></gradient>"
      hyades: "<gradient:#F6B83D:#ff7eb6><bold>[PRIME]</bold></gradient>"
      pastel: "<gradient:#ffb3d9:#ffe28a><bold>[PRIME]</bold></gradient>"
      champagne: "<gradient:#ffe9b0:#d4a017:#ffe9b0><bold>[PRIME]</bold></gradient>"
      magenta-gold: "<gradient:#d6249f:#fd5949:#fdf497><bold>[PRIME]</bold></gradient>"
